# Trees Hate You – ONE FILE VERSION

Save this as `index.html` and open it in your browser.

```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trees Hate You</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  font-family:Arial;
  background:#6fcf65;
}

canvas{
  display:block;
}

#ui{
  position:fixed;
  top:10px;
  left:10px;
  background:rgba(0,0,0,0.7);
  color:white;
  padding:12px;
  border-radius:12px;
  z-index:10;
}
</style>
</head>
<body>

<div id="ui">
  <h2>Trees Hate You</h2>
  <p>Health: <span id="health">100</span></p>
  <p>Wood: <span id="wood">0</span></p>
  <p>WASD = Move</p>
  <p>Click = Chop Trees</p>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const healthText = document.getElementById('health');
const woodText = document.getElementById('wood');

const player = {
  x: canvas.width/2,
  y: canvas.height/2,
  size: 30,
  speed: 5,
  health: 100,
  wood: 0
};

const keys = {};
const trees = [];

function makeTree(){
  trees.push({
    x: Math.random()*canvas.width,
    y: Math.random()*canvas.height,
    size: 40,
    hp: 3,
    angry:false
  });
}

for(let i=0;i<15;i++){
  makeTree();
}

window.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()] = true;
});

window.addEventListener('keyup',e=>{
  keys[e.key.toLowerCase()] = false;
});

canvas.addEventListener('click',()=>{
  trees.forEach((tree,index)=>{
    const dx = player.x-tree.x;
    const dy = player.y-tree.y;
    const dist = Math.sqrt(dx*dx+dy*dy);

    if(dist < 80){
      tree.hp--;
      tree.angry = true;

      if(tree.hp <= 0){
        trees.splice(index,1);
        player.wood += 10;
        woodText.textContent = player.wood;
        makeTree();
      }
    }
  });
});

function movePlayer(){
  if(keys['w']) player.y -= player.speed;
  if(keys['s']) player.y += player.speed;
  if(keys['a']) player.x -= player.speed;
  if(keys['d']) player.x += player.speed;
}

function updateTrees(){
  trees.forEach(tree=>{
    if(tree.angry){
      const dx = player.x-tree.x;
      const dy = player.y-tree.y;
      const dist = Math.sqrt(dx*dx+dy*dy);

      tree.x += (dx/dist)*1.5;
      tree.y += (dy/dist)*1.5;

      if(dist < 35){
        player.health -= 0.1;
        healthText.textContent = Math.floor(player.health);
      }
    }
  });
}

function drawGround(){
  ctx.fillStyle = '#6fcf65';
  ctx.fillRect(0,0,canvas.width,canvas.height);
}

function drawPlayer(){
  ctx.fillStyle = 'blue';
  ctx.fillRect(
    player.x-player.size/2,
    player.y-player.size/2,
    player.size,
    player.size
  );
}

function drawTrees(){
  trees.forEach(tree=>{
    ctx.fillStyle = tree.angry ? 'darkred' : 'green';

    ctx.beginPath();
    ctx.arc(tree.x,tree.y,20,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle='brown';
    ctx.fillRect(tree.x-5,tree.y+10,10,25);
  });
}

function gameLoop(){
  drawGround();

  movePlayer();
  updateTrees();

  drawTrees();
  drawPlayer();

  if(player.health > 0){
    requestAnimationFrame(gameLoop);
  }else{
    ctx.fillStyle='black';
    ctx.font='60px Arial';
    ctx.fillText('GAME OVER',canvas.width/2-180,canvas.height/2);
  }
}

gameLoop();
</script>

</body>
</html>
```
